# codemagic.yaml — TM Measure cloud build pipeline
#
# Two workflows: one for iOS (signed IPA → TestFlight), one for Android
# (signed AAB → Play Internal Testing). Both build the Next.js static
# export first, sync Capacitor, then assemble the native app.
#
# SETUP (one-time, in Codemagic web UI):
#   1. Connect this repository to a Codemagic app.
#   2. Add the iOS signing certificate + provisioning profile (Settings →
#      iOS code signing). Reference: `code_signing.distribution_type:
#      app_store`, `bundle_identifier: ltd.tmdesigns.tmmeasure`.
#   3. Add the Android keystore (Settings → Code signing identities →
#      Android keystore). Reference key alias: `tmmeasure`.
#   4. Add environment groups:
#        - `app_store_connect` — APP_STORE_CONNECT_KEY_IDENTIFIER,
#          APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY,
#          BUNDLE_ID.
#        - `play_store`        — GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
#          PACKAGE_NAME.
#        - `app_runtime`       — NEXT_PUBLIC_MEASURE_SUBMIT_URL,
#          NEXT_PUBLIC_ENABLE_SCAN, NEXT_PUBLIC_ENABLE_LIDAR.
#
#          NEXT_PUBLIC_ENABLE_SCAN=1 is required or the entire
#          auto-scan feature is hidden. It lived only in .env.local,
#          which CI never reads, so every store build shipped without
#          the app's headline feature — confirmed on TestFlight 1024,
#          where no Auto-Scan option appeared at all. Setting
#          NEXT_PUBLIC_ENABLE_LIDAR alone does nothing, because the
#          LiDAR path sits inside the section this flag gates.
#   5. Set the default branch to `main`.
#
# Each workflow build takes ~12–18 min for iOS, ~6–10 min for Android.

workflows:
  ios_release:
    name: TM Measure — iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TM Measure
    environment:
      groups:
        - app_store_connect
        # Supplies NEXT_PUBLIC_MEASURE_SUBMIT_URL. Without it the built app
        # tells customers "Submission endpoint is not configured" and the
        # survey can't be sent — which is the whole point of the app.
        - app_runtime
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      # Fail early and loudly on a missing runtime flag.
      #
      # NEXT_PUBLIC_ENABLE_SCAN=1 gates the entire scan feature. It
      # lived only in .env.local, which CI never reads, and build 1024
      # shipped to the store with the app's headline feature silently
      # absent. Nothing failed; the build was green and the app was
      # simply missing a third of itself, and it cost two rounds of
      # testing to notice a second time.
      #
      # A green build that produces the wrong app is worse than a red
      # one. This makes the misconfiguration impossible to ship quietly.
      - name: Check runtime flags are set
        script: |
          missing=0
          for v in NEXT_PUBLIC_MEASURE_SUBMIT_URL NEXT_PUBLIC_ENABLE_SCAN; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "MISSING: $v is not set."
              missing=1
            else
              echo "OK: $v is set."
            fi
          done
          if [ "$NEXT_PUBLIC_ENABLE_SCAN" != "1" ]; then
            echo "MISSING: NEXT_PUBLIC_ENABLE_SCAN must be exactly 1 to"
            echo "         include the scan feature. Set it in the"
            echo "         'app_runtime' environment group."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add the missing values to the 'app_runtime' group:"
            echo "  Codemagic > tm-measure > Settings > Environment variables"
            exit 1
          fi
      - name: Install JS dependencies
        script: npm ci
      - name: Build Next.js (Capacitor mode)
        script: npm run build:cap
      - name: Sync Capacitor → iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number from Codemagic counter
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1000))
      - name: Fetch/create signing files
        script: |
          keychain initialize
          # Reuse a persistent private key stored in Codemagic (secure env var
          # CERTIFICATE_PRIVATE_KEY). fetch-signing-files creates the matching
          # distribution certificate on the first run and reuses it every build
          # after, so we never pile up throwaway certificates again.
          app-store-connect fetch-signing-files "ltd.tmdesigns.tmmeasure" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Build & sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Uploads the signed IPA to App Store Connect and puts it straight
      # in front of the internal testers.
      #
      # This used to upload only. Every build then had to be added to the
      # tester group by hand in App Store Connect, because the group's
      # "Automatic for Xcode Builds" setting does not cover uploads made
      # through the API — which is how Codemagic uploads. Doing it by
      # hand stopped working entirely: the Add Group dialog opens but its
      # checkbox will not respond, so build 1027 could not be
      # distributed at all.
      #
      # Distributing from here was tried and Apple refuses it:
      #
      #   Failed to add build to 'Internal' beta group.
      #   Builds cannot be assigned to this internal group.
      #   Cannot add internal group to a build.
      #
      # beta_groups only accepts EXTERNAL groups. An internal group is
      # populated by App Store Connect itself, and its "Automatic for
      # Xcode Builds" setting does not cover API uploads, which is how
      # Codemagic uploads — hence the manual step.
      #
      # Left as upload-only so the build stops failing post-processing.
      # To automate this properly the group would have to be external,
      # which brings Beta App Review into the loop for each version.
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android_release:
    name: TM Measure — Android release
    # instance_type left at Codemagic default for the free tier.
    max_build_duration: 45
    environment:
      groups:
        # Supplies NEXT_PUBLIC_MEASURE_SUBMIT_URL — see the iOS workflow.
        - app_runtime
      android_signing:
        - tmmeasure
      java: 21
      node: 22
    scripts:
      # Fail early and loudly on a missing runtime flag.
      #
      # NEXT_PUBLIC_ENABLE_SCAN=1 gates the entire scan feature. It
      # lived only in .env.local, which CI never reads, and build 1024
      # shipped to the store with the app's headline feature silently
      # absent. Nothing failed; the build was green and the app was
      # simply missing a third of itself, and it cost two rounds of
      # testing to notice a second time.
      #
      # A green build that produces the wrong app is worse than a red
      # one. This makes the misconfiguration impossible to ship quietly.
      - name: Check runtime flags are set
        script: |
          missing=0
          for v in NEXT_PUBLIC_MEASURE_SUBMIT_URL NEXT_PUBLIC_ENABLE_SCAN; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "MISSING: $v is not set."
              missing=1
            else
              echo "OK: $v is set."
            fi
          done
          if [ "$NEXT_PUBLIC_ENABLE_SCAN" != "1" ]; then
            echo "MISSING: NEXT_PUBLIC_ENABLE_SCAN must be exactly 1 to"
            echo "         include the scan feature. Set it in the"
            echo "         'app_runtime' environment group."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add the missing values to the 'app_runtime' group:"
            echo "  Codemagic > tm-measure > Settings > Environment variables"
            exit 1
          fi
      - name: Install JS dependencies
        script: npm ci
      - name: Build Next.js (Capacitor mode)
        script: npm run build:cap
      - name: Sync Capacitor → Android
        script: npx cap sync android
      # Play rejects any upload whose versionCode is not strictly higher
      # than the highest already published. Deriving it from BUILD_NUMBER
      # alone is not enough: the counter is shared with the iOS workflow
      # and was behind the value already committed in build.gradle, so
      # the next Android build would have produced a LOWER versionCode
      # and been refused after a full build and upload.
      #
      # Take whichever is greater — the counter-derived value or one past
      # what is already in the file — so the number can only ever climb.
      - name: Bump versionCode from build number
        script: |
          node -e "const fs=require('fs');const f='android/app/build.gradle';const s=fs.readFileSync(f,'utf8');const cur=parseInt((s.match(/versionCode\s+(\d+)/)||[])[1]||'0',10);const fromCounter=parseInt(process.env.BUILD_NUMBER||'0',10)+1000;const c=Math.max(fromCounter,cur+1);fs.writeFileSync(f,s.replace(/versionCode\s+\d+/,'versionCode '+c));console.log('versionCode = '+c+' (file had '+cur+', counter suggested '+fromCounter+')');"
      - name: Build & sign release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    # publishing block deferred until the Google Play service-account
    # credentials are configured in Codemagic env vars. Builds produce
    # an .aab artifact you can download and upload manually in the
    # meantime.
