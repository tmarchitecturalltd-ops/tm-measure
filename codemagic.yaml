# codemagic.yaml — TM Measure cloud build pipeline
#
# Two workflows: one for iOS (signed IPA → TestFlight), one for Android
# (signed AAB → Play Internal Testing). Both build the Next.js static
# export first, sync Capacitor, then assemble the native app.
#
# SETUP (one-time, in Codemagic web UI):
#   1. Connect this repository to a Codemagic app.
#   2. Add the iOS signing certificate + provisioning profile (Settings →
#      iOS code signing). Reference: `code_signing.distribution_type:
#      app_store`, `bundle_identifier: ltd.tmdesigns.tmmeasure`.
#   3. Add the Android keystore (Settings → Code signing identities →
#      Android keystore). Reference key alias: `tmmeasure`.
#   4. Add environment groups:
#        - `app_store_connect` — APP_STORE_CONNECT_KEY_IDENTIFIER,
#          APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY,
#          BUNDLE_ID.
#        - `play_store`        — GCLOUD_SERVICE_ACCOUNT_CREDENTIALS,
#          PACKAGE_NAME.
#        - `app_runtime`       — NEXT_PUBLIC_MEASURE_SUBMIT_URL.
#   5. Set the default branch to `main`.
#
# Each workflow build takes ~12–18 min for iOS, ~6–10 min for Android.

workflows:
  ios_release:
    name: TM Measure — iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_runtime
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ltd.tmdesigns.tmmeasure
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Build Next.js (Capacitor mode)
        script: npm run build:cap
      - name: Sync Capacitor → iOS
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number from Codemagic counter
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1000))
      - name: Build & sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # publishing block is intentionally omitted until Apple Developer
    # enrolment finishes and the App Store Connect integration is
    # configured in Codemagic. Builds will produce an .ipa artifact
    # that you can download from the build page in the meantime.

  android_release:
    name: TM Measure — Android release
    # instance_type left at Codemagic default for the free tier.
    max_build_duration: 45
    environment:
      groups:
        - app_runtime
      # android_signing block re-enable once the keystore is uploaded
      # in Codemagic → Settings → Code signing identities → Android.
      # Until then, gradle uses the debug keystore — fine for build
      # validation but not for Play Store upload.
      java: 21
      node: 22
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Build Next.js (Capacitor mode)
        script: npm run build:cap
      - name: Sync Capacitor → Android
        script: npx cap sync android
      - name: Bump versionCode from build number
        script: |
          node -e "const fs=require('fs');const f='android/app/build.gradle';const c=parseInt(process.env.BUILD_NUMBER||'0',10)+1000;fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/versionCode\s+\d+/,'versionCode '+c));console.log('versionCode = '+c);"
      - name: Build & sign release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    # publishing block deferred until the Google Play service-account
    # credentials are configured in Codemagic env vars. Builds produce
    # an .aab artifact you can download and upload manually in the
    # meantime.
