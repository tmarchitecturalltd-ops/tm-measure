<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android adaptive icon — foreground layer only.

  Per Material's adaptive-icon spec the foreground sits on top of a
  separate background layer (see app-icon-adaptive-background.svg).
  The mask is a system-supplied shape — circle, squircle, rounded
  square — so we keep the mark inside the safe 66 dp inner area.

  ViewBox is 108 × 108 dp to match the platform spec; everything
  visually meaningful lives inside 16 ≤ x ≤ 92 and 16 ≤ y ≤ 92.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432" role="img" aria-label="TM Measure adaptive icon">
  <title>TM Measure</title>

  <!-- Brackets -->
  <g stroke="#b89650" stroke-width="2.4" stroke-linecap="square" fill="none">
    <line x1="28" y1="28" x2="28" y2="34" />
    <line x1="80" y1="28" x2="80" y2="34" />
    <line x1="28" y1="31" x2="80" y2="31" />

    <line x1="28" y1="80" x2="28" y2="74" />
    <line x1="80" y1="80" x2="80" y2="74" />
    <line x1="28" y1="77" x2="80" y2="77" />
  </g>

  <!-- TM monogram, scaled to 108-dp viewport -->
  <g fill="#b89650">
    <rect x="36" y="40" width="6.7" height="40" rx="0.6" />
    <rect x="29.5" y="40" width="20" height="6.7" rx="0.6" />
    <rect x="56.5" y="40" width="6.7" height="40" rx="0.6" />
    <rect x="76.5" y="40" width="6.7" height="40" rx="0.6" />
    <path d="M 63.2 40 L 70 62.9 L 76.8 40 L 76.8 46.7 L 70 68.7 L 63.2 46.7 Z" />
  </g>
</svg>
