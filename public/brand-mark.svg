<?xml version="1.0" encoding="UTF-8"?>
<!--
  TM Designs Ltd. brand mark.

  Two-building line-art glyph: left block has a shed-style sloped
  roof rising to a peak above its right wall, right block is a
  flat-roofed louvred tower. Both share a continuous ground line.
  Pure black strokes on cream so the mark sits cleanly inside iOS
  and Android adaptive icon masks without colour fringing.

  ViewBox 1024 × 1024 — App-Store master resolution, scales down to
  a 40 × 40 favicon without loss.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TM Designs Ltd.">
  <title>TM Designs Ltd.</title>

  <!-- Cream field matches the app's surface token (#fcf9f5). -->
  <rect x="0" y="0" width="1024" height="1024" fill="#fcf9f5"/>

  <g fill="none" stroke="#1c1c1a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left block: shed-roof house. Left wall up, sloped roof
         peaking at the right-hand top, short flat ridge across to
         the shared wall, then back down. -->
    <path d="M 230 820
             L 230 290
             L 540 170
             L 540 820 Z"/>

    <!-- Right block: louvred tower. Same ground baseline; left
         edge shares the line with the left block's right wall. -->
    <rect x="540" y="330" width="280" height="490"/>

    <!-- Four horizontal louvres / window mullions across the
         right tower, evenly spaced (five vertical gaps). -->
    <line x1="540" y1="428" x2="820" y2="428"/>
    <line x1="540" y1="526" x2="820" y2="526"/>
    <line x1="540" y1="624" x2="820" y2="624"/>
    <line x1="540" y1="722" x2="820" y2="722"/>

    <!-- Continuous ground line, extending a touch past each block
         the way the source artwork does. -->
    <line x1="150" y1="852" x2="900" y2="852"/>
  </g>
</svg>
