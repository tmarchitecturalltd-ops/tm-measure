<?xml version="1.0" encoding="UTF-8"?>
<!--
  TM Measure app icon source.

  Square 1024 × 1024 master that exports cleanly to every store size:
    iOS:     1024 (App Store), 180, 167, 152, 120, 87, 80, 76, 60, 58, 40, 29, 20
    Android: 1024 (Play Store), 512 (adaptive 108 dp foreground), 192, 144, 96, 72, 48
    Adaptive Android: separate foreground + background SVGs (the brand
    mark alone for foreground, a flat-fill rect for background).

  Design notes
    Mark    — a stylised "TM" rendered as a calliper / dimension token.
              Vertical strokes echo the gold "T" in the wordmark, while
              the angle bracket on the right reads as a tape-measure
              hook turned into a stylised "M".
    Field   — solid cream (#fcf9f5), no gradient, no shadow. Stores
              re-export with rounded corners so we ship a flat square.
    Foreground colour: brand gold #b89650.
    Stroke widths and counters scaled for the smallest supported icon
    (20 × 20 iOS Notification @1x). Lines stay legible at that size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TM Measure app icon">
  <title>TM Measure</title>

  <!-- Field -->
  <rect x="0" y="0" width="1024" height="1024" fill="#fcf9f5" />

  <!-- Outer dimension brackets (top and bottom rails) -->
  <g stroke="#b89650" stroke-width="22" stroke-linecap="square" fill="none">
    <line x1="208" y1="208" x2="208" y2="270" />
    <line x1="816" y1="208" x2="816" y2="270" />
    <line x1="208" y1="240" x2="816" y2="240" />

    <line x1="208" y1="816" x2="208" y2="754" />
    <line x1="816" y1="816" x2="816" y2="754" />
    <line x1="208" y1="784" x2="816" y2="784" />
  </g>

  <!-- Brand mark — a calliper-style TM monogram -->
  <g fill="#b89650" stroke="none">
    <!-- Vertical stem of the T (shared spine with the M) -->
    <rect x="296" y="320" width="64" height="384" rx="6" />
    <!-- Horizontal crossbar of the T -->
    <rect x="232" y="320" width="192" height="64" rx="6" />

    <!-- M: two outer columns + a V valley between them -->
    <rect x="498" y="320" width="64" height="384" rx="6" />
    <rect x="690" y="320" width="64" height="384" rx="6" />
    <!-- Inner V of the M, rendered as two trapezoidal triangles so it
         reads cleanly at small sizes -->
    <path d="M 562 320 L 626 540 L 690 320 L 690 384 L 626 596 L 562 384 Z" />
  </g>

  <!-- Centre crosshair — a quiet nod to the scan reticle in the app -->
  <g stroke="#b89650" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45">
    <circle cx="512" cy="512" r="8" />
  </g>
</svg>
